<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .calculator-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .operator-group {
            margin-bottom: 20px;
        }

        .result-group {
            margin-top: 30px;
        }

        input[type="text"][readonly] {
            background-color: #f5f5f5;
            cursor: not-allowed;
            font-weight: 600;
            color: #333;
        }

        .equation-display {
            font-size: 18px;
            text-align: center;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>Simple Calculator</h1>
        
        <div class="input-group">
            <label for="number1">First Number:</label>
            <input type="number" id="number1" placeholder="Enter first number">
        </div>

        <div class="operator-group">
            <label for="operator">Operator:</label>
            <select id="operator">
                <option value="+">+ (Addition)</option>
                <option value="-">- (Subtraction)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="number2">Second Number:</label>
            <input type="number" id="number2" placeholder="Enter second number">
        </div>

        <div class="result-group">
            <label for="result">Equation & Result:</label>
            <input type="text" id="result" readonly placeholder="Equation will appear here">
        </div>
    </div>

    <script>
        // Get references to all input elements
        const number1Input = document.getElementById('number1');
        const number2Input = document.getElementById('number2');
        const operatorSelect = document.getElementById('operator');
        const resultInput = document.getElementById('result');

        // Function to calculate and display the result
        function calculate() {
            const num1 = parseFloat(number1Input.value);
            const num2 = parseFloat(number2Input.value);
            const operator = operatorSelect.value;

            // Check if both numbers are valid
            if (isNaN(num1) || isNaN(num2)) {
                resultInput.value = '';
                return;
            }

            let result;
            let equation;

            // Perform calculation based on operator
            if (operator === '+') {
                result = num1 + num2;
                equation = `${num1} + ${num2} = ${result}`;
            } else if (operator === '-') {
                result = num1 - num2;
                equation = `${num1} - ${num2} = ${result}`;
            }

            // Display the equation with result
            resultInput.value = equation;
        }

        // Add event listeners to all input elements
        number1Input.addEventListener('input', calculate);
        number2Input.addEventListener('input', calculate);
        operatorSelect.addEventListener('change', calculate);
    </script>
</body>
</html>
